<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#62a0ea"/>
      <stop offset="1" stop-color="#3584e4"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e8e7e4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
  </defs>
  <!-- tray -->
  <rect x="8" y="16" width="112" height="104" rx="16" fill="#1a5fb4"/>
  <rect x="8" y="8" width="112" height="104" rx="16" fill="url(#base)"/>
  <rect x="8.5" y="8.5" width="111" height="103" rx="15.5" fill="none" stroke="#ffffff" stroke-opacity="0.25"/>
  <!-- sheet, seen in perspective -->
  <path d="M33 21 L97 26 L93 101 L28 95 Z" fill="#000000" fill-opacity="0.35" filter="url(#shadow)" transform="translate(0 3)"/>
  <path d="M33 21 L97 26 L93 101 L28 95 Z" fill="url(#paper)"/>
  <!-- writing -->
  <g stroke-linecap="round" fill="none">
    <path d="M40 34 L70 36.4" stroke="#241f31" stroke-width="4.5"/>
    <g stroke="#9a9996" stroke-width="3">
      <path d="M39.4 45 L86 48.7"/>
      <path d="M38.9 53.5 L85.5 57.2"/>
      <path d="M38.4 62 L85 65.7"/>
      <path d="M37.9 70.5 L72 73.2"/>
    </g>
    <path d="M37.2 81 L57 82.6" stroke="#e01b24" stroke-width="3"/>
  </g>
  <!-- outline and corner handles, like in the app -->
  <path d="M33 21 L97 26 L93 101 L28 95 Z" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"/>
  <g fill="#ffffff" stroke="#1c71d8" stroke-width="3.5">
    <circle cx="33" cy="21" r="7"/>
    <circle cx="97" cy="26" r="7"/>
    <circle cx="93" cy="101" r="7"/>
    <circle cx="28" cy="95" r="7"/>
  </g>
</svg>
